name: MH Intelligence Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12,18 * * *'
    - cron: '0 2 * * *'

permissions:
  contents: write

concurrency:
  group: mh-intelligence-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout radar data
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect fresh official AI news
        run: python collector.py

      - name: Commit radar changes
        run: |
          git config user.name "mh-intelligence-radar[bot]"
          git config user.email "mh-intelligence-radar[bot]@users.noreply.github.com"
          git add noticias.json
          if git diff --cached --quiet; then
            echo "Radar already current. Nothing to commit."
            exit 0
          fi
          git commit -m "data(radar): refresh intelligence feed"
          git push
